<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8a838"/>
      <stop offset="100%" style="stop-color:#f0c060"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Checklist icon -->
  <rect x="140" y="100" width="232" height="312" rx="20" fill="none" stroke="url(#accent)" stroke-width="12"/>
  <line x1="140" y1="155" x2="372" y2="155" stroke="url(#accent)" stroke-width="6"/>
  <!-- Check boxes -->
  <rect x="170" y="180" width="28" height="28" rx="6" fill="none" stroke="#4caf76" stroke-width="5"/>
  <polyline points="178,195 185,203 200,186" fill="none" stroke="#4caf76" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="215" y="185" width="120" height="8" rx="4" fill="#4caf76" opacity="0.6"/>
  
  <rect x="170" y="230" width="28" height="28" rx="6" fill="none" stroke="#5b8def" stroke-width="5"/>
  <polyline points="178,245 185,253 200,236" fill="none" stroke="#5b8def" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="215" y="235" width="100" height="8" rx="4" fill="#5b8def" opacity="0.6"/>
  
  <rect x="170" y="280" width="28" height="28" rx="6" fill="none" stroke="#e8a838" stroke-width="5"/>
  <rect x="215" y="285" width="130" height="8" rx="4" fill="#e8a838" opacity="0.4"/>
  
  <rect x="170" y="330" width="28" height="28" rx="6" fill="none" stroke="#9b6dd7" stroke-width="5"/>
  <rect x="215" y="335" width="90" height="8" rx="4" fill="#9b6dd7" opacity="0.4"/>
  
  <!-- Star accent -->
  <circle cx="380" cy="110" r="24" fill="url(#accent)"/>
  <text x="380" y="118" text-anchor="middle" font-size="28" fill="#1a1a2e">✓</text>
</svg>
